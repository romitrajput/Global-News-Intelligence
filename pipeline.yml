name: Global News Intelligence pipeline

on:
  schedule:
    - cron: "5 * * * *"     # every hour: fetch and summarise new posts
    - cron: "30 1 * * *"    # 07:00 India time: fetch, then write the daily briefing
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: all
        options: [check, fetch, briefing, all]

permissions:
  contents: write

concurrency:
  group: gni-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then MODE=all; else MODE=fetch; fi
          fi
          echo "Mode: $MODE"
          python pipeline.py "$MODE"

      - name: Save results
        run: |
          git config user.name "gni-bot"
          git config user.email "gni-bot@users.noreply.github.com"
          for f in feed.json briefing.json state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Update feed"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
