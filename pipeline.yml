name: Global News Intelligence pipeline

on:
  schedule:
    - cron: "*/15 * * * *"    # every 15 minutes: fetch new posts from the Telegram channels
   # - cron: "30 1 * * *"    # 07:00 India time: fetch, then write the daily briefing (needs ANTHROPIC_API_KEY)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: all
        options: [check, fetch, briefing, all, videos]

permissions:
  contents: write

concurrency:
  group: gni-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Node.js lets the video step read stories with the very same rules the app uses (app.js)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then MODE=all; else MODE=fetch; fi
          fi
          echo "Mode: $MODE"
          python pipeline.py "$MODE"

      - name: Save results
        run: |
          git config user.name "gni-bot"
          git config user.email "gni-bot@users.noreply.github.com"
          for f in feed.json briefing.json state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Update feed"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Phase 2.5: the stories above are already published. Now look for a verified news video for the important ones.
      # This step can be slow, fail or run out of API quota without ever affecting the news (continue-on-error).
      - name: Discover videos
        if: ${{ !contains(fromJSON('["check","briefing","videos"]'), inputs.mode) }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline.py videos

      - name: Save videos
        if: ${{ !contains(fromJSON('["check","briefing","videos"]'), inputs.mode) }}
        run: |
          git config user.name "gni-bot"
          git config user.email "gni-bot@users.noreply.github.com"
          for f in feed.json state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No new videos to save"
          else
            git commit -m "Update videos"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
