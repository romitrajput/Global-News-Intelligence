# Global News Intelligence: what to watch and how.
# Edit this file on GitHub (open it, tap the pencil icon, commit). Lines starting with # are notes.
#
# PRIVACY: this repo is public if you use free GitHub Pages, and feed.json is public too.
# Only add public channels and accounts. Do not add anything private or paid.

# Tells the AI what matters to you (only used when you add an ANTHROPIC_API_KEY). Change it freely.
profile: >
  Global macro and geopolitics, with extra attention to automotive OEMs and their suppliers,
  semiconductors, metals, energy and logistics, and to India and its trading partners.

# Public Telegram channels. Use the name after t.me/ (no @). The channel must have a public web preview:
# open https://t.me/s/NAME in a browser and check that you can see posts.
telegram_public:
  - channel: indusmonitor
  - channel: PoliticsZonee
  - channel : DevelopmentNewsIndia
  - channel : ResonantNews
  - channel : OsntTV
  - channel : marketsz
  - channel : aipost
  - channel : MIB_India
  - channel : markets1

# X (Twitter) accounts. The official X API is pay-per-use (about $0.005 per post read, no free tier).
# Only new posts are read, at most every poll_hours, and never more than max_reads_per_run per run.
# Needs the X_BEARER_TOKEN secret. Set enabled: true to switch it on.
x:
  enabled: false
  poll_hours: 6
  per_account: 10
  max_reads_per_run: 60
  accounts:
    # - SomeNewsAccount
    # - AnotherAccount

# RSS or Atom feeds: news sites, Google News searches, or bridges such as RSSHub for X accounts.
# Bridges for X are unofficial and can stop working without notice.
rss:
  # - name: Example news site
  #   url: https://example.com/rss.xml

# Advanced. Leave alone unless you know why.
settings:
  #extraction_model: claude-haiku-4-5-20251001   # reads each post: fast and cheap
  #briefing_model: claude-sonnet-5               # writes the daily briefing (Sonnet 5 or Opus 5 both work)
  #max_new_per_run: 40      # most posts analysed in one run
  #max_age_hours: 48        # ignore older posts
  #keep_days: 7             # how long stories stay in the app
  #telegram_pages: 2        # pages of about 20 posts read per channel per run
